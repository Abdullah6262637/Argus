[package]
name = "argus_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "argus_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }

# Hashing & Crypto
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# Compression
flate2 = "1"
zip = "4"
tar = "0.4"

# Async / Parallelism
rayon = "1.10"

# Regex / Text
regex = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Directory Walking
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
