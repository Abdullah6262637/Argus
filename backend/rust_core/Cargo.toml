[package]
name = "argus_core"
version = "0.1.0"
edition = "2024"

[lib]
name = "argus_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25.0", features = ["extension-module"] }

# Hashing & Crypto
sha2 = "0.10.8"
md-5 = "0.10.6"
sha1 = "0.10.6"
hmac = "0.12.1"
hex = "0.4.3"
base64 = "0.22.1"
uuid = { version = "1.8.0", features = ["v4"] }

# Compression
flate2 = "1.0.28"
zip = "4.1.3"
tar = "0.4.40"

# Async / Parallelism
rayon = "1.10.0"

# Regex / Text
regex = "1.10.4"

# Serialization
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"

# Directory Walking
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
