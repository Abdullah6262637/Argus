[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -ra --strict-markers
markers =
    slow: yavas testler
    integration: harici servis gerektiren testler
    e2e: end-to-end (DB + agents.yaml + souls)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning