# Example MCP Servers configuration for Argus
servers:
  - name: filesystem
    enabled: false
    description: "Yerel dosya sistemine güvenli erişim (sandboxed klasör)."
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - ./data/sandbox

  - name: github
    enabled: false
    description: "GitHub repo, issue, PR yönetimi."
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"

  - name: sqlite
    enabled: false
    description: "Yerel SQLite veritabanı sorgulama."
    command:
      - npx
      - -y
      - "@modelcontextprotocol/server-sqlite"
      - --db-path
      - ./data/app.db
