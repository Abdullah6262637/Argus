servers:
- name: filesystem
  enabled: true
  description: Yerel dosya sistemine güvenli erişim (sandboxed klasör).
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-filesystem'
  - C:/Users/HP/Documents
- name: github
  enabled: false
  description: GitHub repo, issue, PR yönetimi.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-github'
  env:
    GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
- name: sqlite
  enabled: true
  description: Yerel SQLite veritabanı sorgulama.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-sqlite'
  - --db-path
  - c:/Users/HP/Desktop/Argus/backend/data/umtalagent.db
- name: brave-search
  enabled: false
  description: Brave Search API ile web arama.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-brave-search'
  env:
    BRAVE_API_KEY: ${BRAVE_API_KEY}
- name: puppeteer
  enabled: false
  description: Headless Chromium ile sayfa otomasyonu.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-puppeteer'
- name: slack
  enabled: false
  description: Slack workspace ile entegrasyon.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-slack'
  env:
    SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
    SLACK_TEAM_ID: ${SLACK_TEAM_ID}
- name: memory
  enabled: false
  description: MCP standardı uzun süreli hafıza tool'ları.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-memory'
- name: fetch
  enabled: true
  description: Web sayfası fetch + içerik temizleme.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-fetch'
- name: postgres
  enabled: false
  description: PostgreSQL veritabanlarına doğrudan SQL bağlantısı ve sorgulama yeteneği.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-postgres'
  - --connection-string
  - postgresql://user:password@localhost:5432/dbname
- name: sentry
  enabled: false
  description: Canlı sistemdeki Sentry hata kayıtlarını (exceptions) listeleme ve analiz etme.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-sentry'
  env:
    SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    SENTRY_ORG: ${SENTRY_ORG}
- name: docker
  enabled: false
  description: Yerel Docker daemon'ı ve konteynerleri yönetme aracı.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-docker'
- name: aws
  enabled: false
  description: AWS Cloud kaynaklarını (EC2, S3, RDS vb.) yönetme yeteneği.
  command:
  - npx
  - -y
  - '@modelcontextprotocol/server-aws'
  env:
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    AWS_REGION: ${AWS_REGION}
