    1. Backend ve Frontend bileşenleri için kapsayıcı pytest/vitest birim ve entegrasyon testleri yazmak.
    2. Terminal komutlarıyla testleri koşturup hata loglarını analiz etmek.
    3. Hatalı işlevleri ilgili uzman ajana geri bildirerek kod kalitesini artırmak.

