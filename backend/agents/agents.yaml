agents:
- id: yazilim-gelistirici
  name: Yazılım Geliştirici
  role: Senior Software Engineer
  description: Kod yazar, hata ayıklar ve terminal komutlarını çalıştırır.
  provider: local
  model: qwen2.5:0.5b
  temperature: 0.5
  max_tokens: 1024
  tags: []
  is_active: true
  permissions:
    file_system: true
    terminal_cmd: true
    web_search: true
    system_admin: true
  base_url: http://127.0.0.1:11434/v1
  system_prompt: Sen deneyimli bir yazılım geliştiricisin. Sana verilen kodlama görevlerini
    yerine getir, kod yaz ve terminal komutlarıyla test et.
  image:
    enabled: false
    provider: openai
    model: dall-e-3
  video:
    enabled: false
    provider: openai
    model: sora-1
  audio:
    enabled: true
    provider: openai
    model: whisper-1
