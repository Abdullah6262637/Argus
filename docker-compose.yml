version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus_backend
    ports:
      - "8000:8000"
    volumes:
      - argus-data:/app/data
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///app/data/argus.db
    networks:
      - argus-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: argus_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - argus-network
    restart: unless-stopped

volumes:
  argus-data:
    name: argus_data

networks:
  argus-network:
    name: argus_network
    driver: bridge
